<header class="topbar">
  <a href="/" class="home-btn" title="Página inicial" aria-label="{{ app_nome }} — página inicial">
    {% if app_logo %}<img src="{{ url_for('static', filename=app_logo) }}" alt="{{ app_logo_alt }}" height="30">{% else %}{% include '_logo_discover.html' %}{% endif %}
  </a>
  <nav class="topnav">
    <a href="/busca"{% if ativo == 'buscar' %} class="active"{% endif %}>Buscar</a>
    <a href="/projetos"{% if ativo == 'projetos' %} class="active"{% endif %}>Projetos</a>
    {% if eh_admin %}<a href="/admin"{% if ativo == 'admin' %} class="active"{% endif %}>Administração</a>{% endif %}
  </nav>
  {% if usuario_nome %}
    <div class="topuser">
      <a href="/perfil" class="topuser-nome{{ ' active' if ativo == 'perfil' }}" title="Meu perfil: dados, pastas e buscas salvas">{{ usuario_nome }}</a>
      <form method="post" action="/sair"><button type="submit" class="topuser-sair">Sair</button></form>
    </div>
  {% endif %}
</header>
